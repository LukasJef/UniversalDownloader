name: Build tray app (Windows / macOS / Linux)

# Spustí se při pushnutí tagu ve tvaru v1.0.0, v1.2.3 apod.
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  # umožní i ruční spuštění z GitHub UI (záložka Actions) bez nutnosti tagovat,
  # užitečné pro odzkoušení buildu než uděláš ostrý release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ytdlp-tray-windows
          - os: macos-latest
            artifact_name: ytdlp-tray-macos
          - os: ubuntu-latest
            artifact_name: ytdlp-tray-linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # --- Linux potřebuje systémové balíčky pro tkinter a tray ikonu (GTK/AppIndicator) ---
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-gi gir1.2-gtk-3.0 gir1.2-ayatanaappindicator3-0.1 ffmpeg

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      # Chocolatey ffmpeg balíček pro Windows runner (jen aby šlo otestovat běh, koncový
      # uživatel si ffmpeg musí nainstalovat sám - viz poznámka v appce)
      - name: Install Windows system dependencies
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: pyinstaller --onefile --windowed --name ytdlp-tray ytdlp_tray_app.py

      - name: List dist output (debug)
        run: ls -la dist || dir dist
        shell: bash

      # macOS s --windowed může vyprodukovat .app bundle (složku) místo jednoho souboru -
      # GitHub Release potřebuje jeden soubor, tak to případně zabalíme do zipu
      - name: Package macOS output
        if: runner.os == 'macOS'
        run: |
          cd dist
          if [ -d "ytdlp-tray.app" ]; then
            zip -r ../ytdlp-tray-macos.zip ytdlp-tray.app
          else
            zip -j ../ytdlp-tray-macos.zip ytdlp-tray
          fi

      - name: Package Linux output
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/ytdlp-tray
          cd dist && zip -j ../ytdlp-tray-linux.zip ytdlp-tray

      - name: Package Windows output
        if: runner.os == 'Windows'
        shell: bash
        run: cd dist && 7z a ../ytdlp-tray-windows.zip ytdlp-tray.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ytdlp-tray-*.zip
          if-no-files-found: error

  release:
    # tenhle job běží až po úspěšném doběhnutí všech tří buildů výše,
    # a jen pokud šlo o push skutečného tagu (ne ruční workflow_dispatch test)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # bez tohohle GITHUB_TOKEN nemůže vytvořit/upravit release
                        # (default je jen read-only) -> "Resource not accessible by integration"
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all platform builds
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
